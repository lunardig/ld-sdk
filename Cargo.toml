[workspace]
resolver = "2"
members = ["crates/ld-sdk", "crates/ld-mock", "crates/ld-mock-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
ld-interfaces-types = { path = "vendor/ld-interfaces/packages/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
