[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ld-client"
version = "0.1.0a1"
description = "Python client for Lunar Dig engines over I-1 (LD-PEC-002 §5)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
include = ["ld_client*"]
