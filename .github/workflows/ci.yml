name: ci

on:
  push:
    branches: [main]
  pull_request:

# vendor/ld-interfaces is a private submodule. The default GITHUB_TOKEN checks out this
# repository; it cannot read another private one, so the submodule is fetched with
# LD_INTERFACES_TOKEN: a fine-grained token owned by lunardig with Contents: read on
# lunardig/ld-interfaces only.
env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: "0.2.100"

jobs:
  native:
    name: Rust, fixtures and TS client (native mock)
    runs-on: ubuntu-latest
    steps:
      - name: Check LD_INTERFACES_TOKEN can read lunardig/ld-interfaces
        env:
          T: ${{ secrets.LD_INTERFACES_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::error::LD_INTERFACES_TOKEN is empty in this job. It must be an Actions repository secret on ld-sdk (or an org secret granted to ld-sdk), not a Dependabot, Codespaces or environment secret."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" https://api.github.com/repos/lunardig/ld-interfaces)
          contents=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" https://api.github.com/repos/lunardig/ld-interfaces/contents/README.md)
          user=$(curl -s -H "Authorization: Bearer $T" https://api.github.com/user | python3 -c 'import sys,json; print(json.load(sys.stdin).get("login","?"))')
          echo "::notice::token belongs to $user; repo metadata HTTP $code; contents HTTP $contents"
          [ "$code" = 200 ] && [ "$contents" = 200 ] || { echo "::error::token cannot read lunardig/ld-interfaces (metadata $code, contents $contents)"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch vendor/ld-interfaces with LD_INTERFACES_TOKEN
        env:
          T: ${{ secrets.LD_INTERFACES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${T}@github.com/lunardig/ld-interfaces".insteadOf "https://github.com/lunardig/ld-interfaces"
          git submodule update --init --recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r vendor/ld-interfaces/requirements.txt
      - name: Fixtures are current
        run: python fixtures/build.py && git diff --exit-code -- fixtures
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --bin ld-mock-cli
      - name: Schema, determinism, subdivision and restore checks
        run: python tools/check_fixtures.py
      - run: npm ci
        working-directory: ts
      - run: npm test
        working-directory: ts
      - uses: actions/upload-artifact@v4
        with:
          name: ld-mock-cli
          path: target/release/ld-mock-cli

  wasm:
    name: WebAssembly build agrees with native
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch vendor/ld-interfaces with LD_INTERFACES_TOKEN
        env:
          T: ${{ secrets.LD_INTERFACES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${T}@github.com/lunardig/ld-interfaces".insteadOf "https://github.com/lunardig/ld-interfaces"
          git submodule update --init --recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Cache wasm-bindgen-cli
        id: bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-${{ runner.os }}
      - if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version ${{ env.WASM_BINDGEN_VERSION }} --locked
      - run: ./tools/build-wasm.sh
      - uses: actions/download-artifact@v4
        with:
          name: ld-mock-cli
          path: target/release
      - run: chmod +x target/release/ld-mock-cli
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: ts
      - name: Wasm test must run, not skip
        working-directory: ts
        run: |
          npm test 2>&1 | tee test.log
          ! grep -q "# SKIP" test.log
      - uses: actions/upload-artifact@v4
        with:
          name: ld-mock-wasm
          path: ts/wasm
